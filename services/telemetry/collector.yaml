extensions:
    health_check:
        endpoint: 0.0.0.0:13133

receivers:
    otlp:
        protocols:
            http:
                endpoint: 0.0.0.0:4318

processors:
    memory_limiter:
        check_interval: 1s
        limit_mib: 128
        spike_limit_mib: 32
    batch:
        timeout: 1s
        send_batch_size: 256

exporters:
    file/traces:
        path: /var/data/traces.json
        rotation:
            max_megabytes: 10
            max_backups: 20
    file/metrics:
        path: /var/data/metrics.json
        rotation:
            max_megabytes: 10
            max_backups: 20
    file/logs:
        path: /var/data/logs.json
        rotation:
            max_megabytes: 10
            max_backups: 20
    debug:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 200

service:
    extensions: [health_check]
    telemetry:
        metrics:
            readers:
                - pull:
                      exporter:
                          prometheus:
                              host: 0.0.0.0
                              port: 8888
    pipelines:
        traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [debug, file/traces]
        metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [debug, file/metrics]
        logs:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [debug, file/logs]
