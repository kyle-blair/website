services:
    - type: web
      name: zerofourtwo.com
      runtime: docker
      plan: 0.5c-512mb
      region: oregon
      dockerfilePath: ./containerfile
      dockerContext: .
      branch: main
      autoDeployTrigger: off
      healthCheckPath: /api/health
      maxShutdownDelaySeconds: 30
      envVars:
          - key: OTEL_EXPORTER_OTLP_ENDPOINT
            sync: false
          - key: STORAGE_SERVICE_URL
            fromService:
                type: web
                name: zerofourtwo.com-storage
                envVarKey: RENDER_EXTERNAL_URL
          - key: STORAGE_SERVICE_TOKEN
            fromService:
                type: web
                name: zerofourtwo.com-storage
                envVarKey: STORAGE_SERVICE_TOKEN

    - type: web
      name: zerofourtwo.com-storage
      runtime: docker
      plan: 0.5c-512mb
      region: oregon
      dockerfilePath: ./services/storage/containerfile
      dockerContext: .
      branch: main
      autoDeployTrigger: off
      healthCheckPath: /health/live
      maxShutdownDelaySeconds: 30
      envVars:
          - key: OTEL_EXPORTER_OTLP_ENDPOINT
            sync: false
          - key: STORAGE_SERVICE_TOKEN
            generateValue: true
          - key: DATABASE_URL
            fromDatabase:
                name: zerofourtwo.com-database
                property: connectionString

    - type: pserv
      name: zerofourtwo.com-telemetry
      runtime: docker
      plan: 0.5c-512mb
      region: oregon
      dockerfilePath: ./services/telemetry/containerfile
      dockerContext: ./services/telemetry
      branch: main
      autoDeployTrigger: off
      disk:
          name: telemetry-data
          mountPath: /var/data
          sizeGB: 1
      envVars:
          - key: PORT
            value: "4318"

databases:
    - name: zerofourtwo.com-database
      plan: 0.1c-256mb
      region: oregon
      postgresMajorVersion: "18"
      databaseName: website
      user: storage_service
      ipAllowList: []
      diskSizeGB: 1
