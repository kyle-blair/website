services:
    website:
        environment:
            OTEL_METRIC_EXPORT_INTERVAL: "1000"
            OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:1
            OTEL_EXPORTER_OTLP_HEADERS: ""
        ports: !reset []

    tests:
        build:
            context: .
            dockerfile: containers/integration/tests.containerfile
