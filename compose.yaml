services:
    website:
        build:
            context: .
            dockerfile: containerfile
        ports:
            - "127.0.0.1:3000:10000"
        environment:
            STORAGE_SERVICE_URL: http://storage:10000
            STORAGE_SERVICE_TOKEN: ${STORAGE_SERVICE_TOKEN:?Set STORAGE_SERVICE_TOKEN}
            STORAGE_ALLOW_HTTP: "true"
        depends_on:
            storage:
                condition: service_healthy
        networks: [public, storage]
        restart: unless-stopped
        stop_grace_period: 30s

    storage:
        build:
            context: ./services/storage
            dockerfile: containerfile
        environment:
            STORAGE_SERVICE_TOKEN: ${STORAGE_SERVICE_TOKEN:?Set STORAGE_SERVICE_TOKEN}
            PGHOST: database
            PGPORT: "5432"
            PGDATABASE: website
            PGUSER: storage_service
            PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
        depends_on:
            database:
                condition: service_healthy
        healthcheck:
            test:
                [
                    CMD,
                    node,
                    --input-type=module,
                    --eval,
                    "const response = await fetch('http://127.0.0.1:10000/health/live'); process.exit(response.ok ? 0 : 1)",
                ]
            interval: 5s
            timeout: 3s
            retries: 10
        networks: [storage]
        restart: unless-stopped
        stop_grace_period: 30s

    database:
        image: postgres:18-bookworm
        environment:
            POSTGRES_DB: website
            POSTGRES_USER: storage_service
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                [CMD, pg_isready, --username=storage_service, --dbname=website]
            interval: 5s
            timeout: 3s
            retries: 10
        networks: [storage]
        restart: unless-stopped
        stop_grace_period: 30s

networks:
    public:
    storage:
        internal: true

volumes:
    postgres-data:
