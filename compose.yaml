services:
    website:
        healthcheck:
            test:
                - CMD
                - node
                - scripts/health-check.mjs
                - http://127.0.0.1:10000/api/health
            interval: 5s
            timeout: 3s
            retries: 10
        build:
            context: .
            dockerfile: containerfile
        ports:
            - "127.0.0.1:3000:10000"
        environment:
            DATABASE_URL: postgresql://storage_service:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/website
            OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
            OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
        restart: unless-stopped
        stop_grace_period: 30s

    database:
        image: postgres:18-bookworm
        environment:
            POSTGRES_DB: website
            POSTGRES_USER: storage_service
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                [
                    CMD,
                    pg_isready,
                    --host=127.0.0.1,
                    --username=storage_service,
                    --dbname=website,
                ]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped
        stop_grace_period: 30s

volumes:
    postgres-data:
