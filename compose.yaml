services:
    website:
        healthcheck:
            test:
                - CMD
                - curl
                - --fail
                - --silent
                - --show-error
                - --max-time
                - "2"
                - --output
                - /dev/null
                - http://127.0.0.1:10000/api/health
            interval: 5s
            timeout: 3s
            retries: 10
        build:
            context: .
            dockerfile: containerfile
        ports:
            - "127.0.0.1:3000:10000"
        environment:
            STORAGE_SERVICE_URL: http://storage:10000
            STORAGE_SERVICE_TOKEN: ${STORAGE_SERVICE_TOKEN:?Set STORAGE_SERVICE_TOKEN}
            STORAGE_ALLOW_HTTP: "true"
            OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
            OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
            OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
        networks: [public, storage]
        restart: unless-stopped
        stop_grace_period: 30s

    storage:
        build:
            context: .
            dockerfile: services/storage/containerfile
        environment:
            STORAGE_SERVICE_TOKEN: ${STORAGE_SERVICE_TOKEN:?Set STORAGE_SERVICE_TOKEN}
            OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
            OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
            OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
            PGHOST: database
            PGPORT: "5432"
            PGDATABASE: website
            PGUSER: storage_service
            PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
        depends_on:
            database:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - curl
                - --fail
                - --silent
                - --show-error
                - --max-time
                - "2"
                - --output
                - /dev/null
                - http://127.0.0.1:10000/health/live
            interval: 5s
            timeout: 3s
            retries: 10
        networks: [public, storage]
        restart: unless-stopped
        stop_grace_period: 30s

    database:
        image: postgres:18-bookworm
        environment:
            POSTGRES_DB: website
            POSTGRES_USER: storage_service
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                [CMD, pg_isready, --username=storage_service, --dbname=website]
            interval: 5s
            timeout: 3s
            retries: 10
        networks: [storage]
        restart: unless-stopped
        stop_grace_period: 30s

networks:
    public:
    storage:
        internal: true

volumes:
    postgres-data:
