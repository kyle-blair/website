on:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        uses: ./.github/workflows/test.yaml

    deploy-website:
        needs: test
        uses: ./.github/workflows/deploy.yaml
        secrets:
            deploy_url: ${{ secrets.WEBSITE_DEPLOY_HOOK_URL }}

    deploy-telemetry:
        needs: test
        uses: ./.github/workflows/deploy.yaml
        secrets:
            deploy_url: ${{ secrets.TELEMETRY_DEPLOY_HOOK_URL }}

    deploy-storage:
        needs: test
        uses: ./.github/workflows/deploy.yaml
        secrets:
            deploy_url: ${{ secrets.STORAGE_DEPLOY_HOOK_URL }}
