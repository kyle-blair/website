on:
    workflow_call:

permissions:
    contents: read

jobs:
    test:
        runs-on: ${{ vars.runner || 'ubuntu-24.04' }}
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version-file: package.json
                  cache: npm
            - run: npm clean-install
            - run: npm test
